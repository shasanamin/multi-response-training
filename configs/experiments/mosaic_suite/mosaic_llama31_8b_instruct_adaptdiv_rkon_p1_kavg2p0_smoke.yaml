data:
  source: local_mosaic
  raw_path: data/mosaic-1k.jsonl
  min_responses: 1
  train_fraction: 0.86
  validation_fraction: 0.04
  prompt_variants_per_cluster: 1
  eval_prompt_variants_per_cluster: 4
  response_mode: all
  eval_response_mode: all
  response_index: 0
  max_reference_responses_per_prompt: 4
  max_train_clusters: 32
  max_validation_clusters: 8
  max_test_clusters: 8
  prepared_path: ${SCRATCH_ROOT}/data/mrt/mosaic/pools_trainv1_evalv4_all_smoke_seed7.jsonl
selection:
  strategy: rkon
  n: 4
  k: 4
  quality_weight_alpha: 1.0
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  adaptive_k:
    enabled: true
    score: response_embedding_diversity
    target_mean_k: 2.0
    min_k: 1
    max_k: 4
    score_power: 1.0
    score_floor: 1.0e-08
training:
  use_lora: true
  max_length: 768
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 1
  learning_rate: 0.00012
  weight_decay: 0.01
  warmup_ratio: 0.03
  logging_steps: 1
  eval_steps: 1
  save_steps: 1
  save_total_limit: 1
  gradient_checkpointing: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  optim: adamw_torch
  max_steps: 1
generation:
  num_return_sequences_single: 1
  num_return_sequences_multi: 2
  multi_k_values:
  - 2
  max_new_tokens: 48
  max_length_for_eval: 768
  temperature: 0.8
  top_p: 0.95
evaluation:
  eval_batch_size: 1
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
model:
  key: llama31_8b_instruct
  trust_remote_code: true
run:
  name: mosaic_llama31_8b_instruct_adaptdiv_rkon_p1_kavg2p0_smoke
  seed: 7
