data:
  hf_dataset_id: tlc4418/gold_labelled_gens
  hf_split: validation
  max_reference_responses_per_prompt: 32
  max_test_prompts: 100
  max_train_prompts: 800
  max_validation_prompts: 64
  min_responses: 4
  prepared_path: ${SCRATCH_ROOT}/data/mrt/gold_labelled_gens/prompt_pools_publication_800_64_100_seed7.jsonl
  source: hf_gold_labelled_gens
  train_fraction: 0.8
  validation_fraction: 0.1
evaluation:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  eval_batch_size: 2
  reward_model:
    batch_size: 8
    model_name: Skywork/Skywork-Reward-V2-Llama-3.1-8B
    trust_remote_code: true
generation:
  max_length_for_eval: 1024
  max_new_tokens: 128
  multi_k_values:
  - 2
  - 4
  - 8
  - 16
  num_return_sequences_multi: 16
  num_return_sequences_single: 1
  temperature: 0.8
  top_p: 0.95
model:
  key: llama31_8b_instruct
  trust_remote_code: true
run:
  name: gold_gens_llama31_8b_instruct_dbkon_k4_alpha2_alpha_sweep
  seed: 7
selection:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  k: 4
  n: 64
  quality_weight_alpha: 2.0
  reward_model:
    batch_size: 8
    model_name: Skywork/Skywork-Reward-V2-Llama-3.1-8B
    trust_remote_code: true
  score_source: reward_model
  strategy: dbkon
training:
  eval_steps: 100
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  learning_rate: 0.00012
  logging_steps: 5
  lora_alpha: 32
  lora_dropout: 0.05
  lora_r: 16
  max_length: 1024
  num_train_epochs: 1
  optim: adamw_torch
  per_device_eval_batch_size: 1
  per_device_train_batch_size: 1
  save_steps: 50
  save_total_limit: 8
  use_lora: true
  warmup_ratio: 0.03
  weight_decay: 0.01
