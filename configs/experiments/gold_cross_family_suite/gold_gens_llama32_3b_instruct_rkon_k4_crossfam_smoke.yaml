data:
  source: hf_gold_labelled_gens
  hf_dataset_id: tlc4418/gold_labelled_gens
  hf_split: validation
  prepared_path: ${SCRATCH_ROOT}/data/mrt/gold_labelled_gens/prompt_pools_smoke_48_16_16_seed7.jsonl
  min_responses: 4
  train_fraction: 0.8
  validation_fraction: 0.1
  max_train_prompts: 48
  max_validation_prompts: 16
  max_test_prompts: 16
  max_reference_responses_per_prompt: 16
selection:
  strategy: rkon
  n: 16
  k: 4
  quality_weight_alpha: 1.0
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
training:
  use_lora: true
  max_length: 1024
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  max_steps: 2
  learning_rate: 0.00015
  weight_decay: 0.01
  warmup_ratio: 0.03
  logging_steps: 1
  eval_steps: 2
  save_steps: 2
  save_total_limit: 1
  gradient_checkpointing: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  optim: adamw_torch
generation:
  num_return_sequences_single: 1
  num_return_sequences_multi: 8
  multi_k_values:
  - 2
  - 4
  - 8
  max_new_tokens: 96
  max_length_for_eval: 1024
  temperature: 0.8
  top_p: 0.95
evaluation:
  eval_batch_size: 2
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  reward_model:
    model_name: Skywork/Skywork-Reward-V2-Llama-3.1-8B
    batch_size: 8
    trust_remote_code: true
run:
  name: gold_gens_llama32_3b_instruct_rkon_k4_crossfam_smoke
  seed: 7
model:
  key: llama32_3b_instruct
  trust_remote_code: true
