data:
  source: hf_nectar
  hf_dataset_id: berkeley-nest/Nectar
  hf_split: train
  prepared_path: ${SCRATCH_ROOT}/data/mrt/nectar/prompt_pools_publication_1200_128_256_seed7.jsonl
  min_responses: 4
  train_fraction: 0.8
  validation_fraction: 0.1
  max_train_prompts: 1200
  max_validation_prompts: 128
  max_test_prompts: 256
  max_reference_responses_per_prompt: 7
selection:
  strategy: rkon
  k: 2
  quality_weight_alpha: 1.0
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  score_source: reward_model
  reward_model:
    model_name: Skywork/Skywork-Reward-V2-Llama-3.1-8B
    batch_size: 8
    trust_remote_code: true
  n: 7
training:
  use_lora: true
  max_length: 1024
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 1
  learning_rate: 0.00012
  weight_decay: 0.01
  warmup_ratio: 0.03
  logging_steps: 5
  eval_steps: 100
  save_steps: 50
  save_total_limit: 8
  gradient_checkpointing: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  optim: adamw_torch
generation:
  num_return_sequences_single: 1
  num_return_sequences_multi: 16
  multi_k_values:
  - 2
  - 4
  - 8
  - 16
  max_new_tokens: 128
  max_length_for_eval: 1024
  temperature: 0.8
  top_p: 0.95
evaluation:
  eval_batch_size: 2
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  reward_model:
    model_name: Skywork/Skywork-Reward-V2-Llama-3.1-8B
    batch_size: 8
    trust_remote_code: true
model:
  key: llama31_8b_instruct
  trust_remote_code: true
run:
  name: nectar_llama31_8b_instruct_rkon_k2_nectar_full
  seed: 7
