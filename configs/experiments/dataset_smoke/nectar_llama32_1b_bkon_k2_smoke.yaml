run:
  name: nectar_llama32_1b_instruct_bkon_k2_smoke
  seed: 7

data:
  source: hf_nectar
  hf_dataset_id: berkeley-nest/Nectar
  hf_split: train
  prepared_path: ${SCRATCH_ROOT}/data/mrt/nectar/prompt_pools_smoke_16_4_4_seed7.jsonl
  min_responses: 4
  train_fraction: 0.8
  validation_fraction: 0.1
  max_train_prompts: 16
  max_validation_prompts: 4
  max_test_prompts: 4
  max_reference_responses_per_prompt: 7

selection:
  strategy: bkon
  n: 7
  k: 2
  score_source: reward_model
  quality_weight_alpha: 1.0
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  reward_model:
    model_name: Skywork/Skywork-Reward-V2-Llama-3.1-8B
    batch_size: 8
    trust_remote_code: true

evaluation:
  eval_batch_size: 2
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  reward_model:
    model_name: Skywork/Skywork-Reward-V2-Llama-3.1-8B
    batch_size: 8
    trust_remote_code: true

model:
  key: llama32_1b_instruct
  trust_remote_code: true
